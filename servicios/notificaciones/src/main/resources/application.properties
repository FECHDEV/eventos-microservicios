spring.application.name=notificaciones
server.port=8083

spring.jackson.time-zone=America/La_Paz

# Clave que comparten los servicios internos
eventos.clave-servicio=${EVENTOS_CLAVE_SERVICIO}

# simulador solo escribe en el log. smtp entrega al servidor de correo (decisiones.md -> Notificaciones)
eventos.correo.proveedor=${EVENTOS_CORREO_PROVEEDOR:simulador}
eventos.correo.remitente=${EVENTOS_CORREO_REMITENTE:Sarao <no-responder@mail.com>}
# Arma los enlaces de los correos (restablecer, mis-entradas)
eventos.correo.url-del-sitio=${EVENTOS_SITIO_URL:http://localhost}
spring.mail.host=${EVENTOS_CORREO_HOST:localhost}
spring.mail.port=${EVENTOS_CORREO_PUERTO:25}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Al apagarse, los correos en cola se terminan de enviar
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=20s

# Solo se entra con la clave de servicio: no hay usuarios ni contrasena generada
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
