spring.application.name=gateway
server.port=8080

eventos.seguridad-url=${EVENTOS_SEGURIDAD_URL:http://localhost:8081}
eventos.venta-url=${EVENTOS_VENTA_URL:http://localhost:8082}

# El gateway no lee las subidas: las pasa enteras y el limite lo pone el servicio
spring.servlet.multipart.enabled=false

# Sin valor por defecto: si falta, el gateway no arranca
eventos.clave-servicio=${EVENTOS_CLAVE_SERVICIO}

# Detras de nginx: la IP del cliente sale de X-Forwarded-For
server.forward-headers-strategy=native

# Sin esto el gateway borra X-Forwarded-For y Seguridad veria a todos con la misma IP
spring.cloud.gateway.server.webmvc.trusted-proxies=.*
