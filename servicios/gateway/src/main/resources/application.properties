spring.application.name=gateway
server.port=8080

# Solo se enrutan rutas publicas de /api: las de /interno nunca salen por aca
spring.cloud.gateway.server.webmvc.routes[0].id=seguridad
spring.cloud.gateway.server.webmvc.routes[0].uri=${EVENTOS_SEGURIDAD_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**,/api/cuenta/**,/api/usuarios/**
