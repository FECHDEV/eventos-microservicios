spring.application.name=gateway
server.port=8080

eventos.seguridad-url=${EVENTOS_SEGURIDAD_URL:http://localhost:8081}

# Sin valor por defecto: si falta, el gateway no arranca
eventos.clave-servicio=${EVENTOS_CLAVE_SERVICIO}

# Sin esto el gateway borra X-Forwarded-For y Seguridad veria a todos con la misma IP
spring.cloud.gateway.server.webmvc.trusted-proxies=.*
