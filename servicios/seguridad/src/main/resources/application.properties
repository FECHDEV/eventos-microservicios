spring.application.name=seguridad
server.port=8081

# Sin perfil activo se carga application-local.properties (ignorado por git)
spring.profiles.default=local

# El prefijo EVENTOS_ evita chocar con DB_USER y DB_PASSWORD de otro proyecto,
# definidas a nivel de sistema en la maquina de desarrollo
spring.datasource.url=jdbc:mysql://${EVENTOS_DB_HOST:localhost}:${EVENTOS_DB_PORT:3306}/seguridad_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/La_Paz&characterEncoding=UTF-8
spring.datasource.username=seguridad_app
spring.datasource.password=${EVENTOS_SEGURIDAD_DB_PASSWORD:}

# Sin migraciones: el esquema lo genera Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.jackson.time-zone=America/La_Paz

# La autenticacion es por JWT: sin el usuario en memoria que Spring Boot crea
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
