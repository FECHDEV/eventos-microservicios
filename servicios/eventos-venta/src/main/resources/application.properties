spring.application.name=eventos-venta
server.port=8082

# Sin perfil activo se carga application-local.properties (ignorado por git)
spring.profiles.default=local

# El prefijo EVENTOS_ evita chocar con DB_USER y DB_PASSWORD de otro proyecto,
# definidas a nivel de sistema en la maquina de desarrollo
spring.datasource.url=jdbc:mysql://${EVENTOS_DB_HOST:localhost}:${EVENTOS_DB_PORT:3306}/eventos_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/La_Paz&characterEncoding=UTF-8&sessionVariables=innodb_lock_wait_timeout=5
spring.datasource.username=eventos_app
spring.datasource.password=${EVENTOS_EVENTOS_DB_PASSWORD:}

# Sin migraciones: el esquema lo genera Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.jackson.time-zone=America/La_Paz
# Una cantidad con decimales es un dato invalido, no se redondea
spring.jackson.deserialization.accept-float-as-int=false

# Sin valor por defecto: si falta, el servicio no arranca
eventos.clave-servicio=${EVENTOS_CLAVE_SERVICIO}

# Seguridad, para los datos de una cuenta
eventos.seguridad-url=${EVENTOS_SEGURIDAD_URL:http://localhost:8081}

# Imagenes de los eventos (decisiones.md -> Imagen del evento). Carpeta del
# servidor; en Docker, un volumen. Hasta 2 MB por imagen: el limite de la peticion
# deja margen para los demas datos del formulario multipart
eventos.imagenes.directorio=${EVENTOS_IMAGENES_DIRECTORIO:./datos/imagenes}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
# Tomcat corta la subida en el limite de multipart y despues descarta lo que
# queda. Con 20 MB una foto de celular recibe el aviso IMAGEN_DEMASIADO_GRANDE en
# vez de un corte de conexion
server.tomcat.max-swallow-size=20MB

# Cierre automatico de la venta (CU-12 FA-01), en milisegundos
eventos.cierre-de-venta.intervalo=60000

# La identidad llega del gateway: sin el usuario en memoria que Spring Boot crea
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
