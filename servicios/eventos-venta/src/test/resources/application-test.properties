# H2 en memoria, en modo de compatibilidad con MySQL
spring.datasource.url=jdbc:h2:mem:eventos_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

# Valores fijos solo para pruebas
eventos.clave-servicio=clave-de-pruebas

# Imagenes de las pruebas de integracion, fuera del arbol del proyecto
eventos.imagenes.directorio=${java.io.tmpdir}/sarao-pruebas-imagenes

# La tarea del cierre automatico no dispara sola durante las pruebas
eventos.cierre-de-venta.intervalo=3600000
