# H2 en memoria, en modo de compatibilidad con MySQL
spring.datasource.url=jdbc:h2:mem:pagos_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

# Valores fijos solo para pruebas
eventos.clave-servicio=clave-de-pruebas

# La conciliacion automatica no dispara sola durante las pruebas
eventos.pago.conciliacion.intervalo=3600000
