spring.application.name=pagos
server.port=8084

# Sin perfil activo se carga application-local.properties (ignorado por git)
spring.profiles.default=local

# El prefijo EVENTOS_ evita chocar con DB_USER y DB_PASSWORD de otro proyecto,
# definidas a nivel de sistema en la maquina de desarrollo. La espera de un
# bloqueo cubre la confirmacion, que tiene el pago tomado mientras responde
# Eventos y Venta (hasta 4 s)
spring.datasource.url=jdbc:mysql://${EVENTOS_DB_HOST:localhost}:${EVENTOS_DB_PORT:3306}/pagos_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/La_Paz&characterEncoding=UTF-8&sessionVariables=innodb_lock_wait_timeout=10
spring.datasource.username=pagos_app
spring.datasource.password=${EVENTOS_PAGOS_DB_PASSWORD:}

# Sin migraciones: el esquema lo genera Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.jackson.time-zone=America/La_Paz

# Sin valor por defecto: si falta, el servicio no arranca
eventos.clave-servicio=${EVENTOS_CLAVE_SERVICIO}

# Eventos y Venta, duenio de la reserva y del cupo
eventos.venta-url=${EVENTOS_VENTA_URL:http://localhost:8082}

# Sistema de pago: simulador por defecto (decisiones.md -> Pago: interfaz propia)
eventos.pago.proveedor=${EVENTOS_PAGO_PROVEEDOR:simulador}
# Conciliacion de pagos pendientes (CU-07 RF-20), en milisegundos
eventos.pago.conciliacion.intervalo=60000

# La identidad llega del gateway: sin el usuario en memoria que Spring Boot crea
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
