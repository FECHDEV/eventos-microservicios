# Sarao en Docker.
#   cp .env.example .env    (y completar los valores)
#   docker compose up -d --build
# La API queda en http://localhost/api (o el puerto de SARAO_PUERTO).

services:
  base:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD en .env}
      SEGURIDAD_DB_PASSWORD: ${EVENTOS_SEGURIDAD_DB_PASSWORD:?Falta EVENTOS_SEGURIDAD_DB_PASSWORD en .env}
      EVENTOS_DB_PASSWORD: ${EVENTOS_EVENTOS_DB_PASSWORD:?Falta EVENTOS_EVENTOS_DB_PASSWORD en .env}
      PAGOS_DB_PASSWORD: ${EVENTOS_PAGOS_DB_PASSWORD:?Falta EVENTOS_PAGOS_DB_PASSWORD en .env}
      TZ: America/La_Paz
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - datos-mysql:/var/lib/mysql
      - ./mysql/crear-bases.sh:/docker-entrypoint-initdb.d/crear-bases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    # Sin puertos publicados: solo los servicios llegan a la base

  seguridad:
    build:
      context: ./servicios/seguridad
      dockerfile: ../Dockerfile
    restart: unless-stopped
    depends_on:
      base:
        condition: service_healthy
    environment:
      EVENTOS_DB_HOST: base
      EVENTOS_SEGURIDAD_DB_PASSWORD: ${EVENTOS_SEGURIDAD_DB_PASSWORD}

  gateway:
    build:
      context: ./servicios/gateway
      dockerfile: ../Dockerfile
    restart: unless-stopped
    depends_on:
      - seguridad
    environment:
      EVENTOS_SEGURIDAD_URL: http://seguridad:8081
    # shortcut: publicado directo mientras no exista el frontend, pasa detrás de nginx con HU-09
    ports:
      - "${SARAO_PUERTO:-80}:8080"

volumes:
  datos-mysql:
