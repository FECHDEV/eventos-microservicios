# Sarao en producción: la aplicación Angular y, bajo /api, el gateway.

# Límite por IP de las dos rutas públicas que escriben sin sesión: el contador de
# visitas (una por pantalla) y el aviso de pago (lo manda el sistema de pago). Un
# exceso recibe 429; el resto de la API ya pide sesión o tiene sus propios límites
limit_req_zone $binary_remote_addr zone=visitas:1m rate=2r/s;
limit_req_zone $binary_remote_addr zone=avisos:1m rate=1r/s;
limit_req_status 429;

server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	# El DNS de Docker: si se recrea el gateway, nginx ve su IP nueva sin reiniciar
	resolver 127.0.0.11 valid=10s;

	# Imágenes de eventos de hasta 2 MB en un formulario de hasta 3 MB (application.properties).
	# Un poco más, para que el backend responda IMAGEN_DEMASIADO_GRANDE en vez de cortar nginx
	client_max_body_size 5m;

	# Con el proxy HTTPS adelante (docker-compose.produccion.yml), la IP del cliente
	# viene en X-Forwarded-For; solo se le cree a una dirección de la red de Docker.
	# Publicado directo, el cliente llega con su IP pública y el encabezado se ignora
	set_real_ip_from 172.16.0.0/12;
	set_real_ip_from 10.0.0.0/8;
	set_real_ip_from 192.168.0.0/16;
	real_ip_header X-Forwarded-For;

	# ^~: una ruta de la API nunca cae en la regla de archivos estáticos de abajo
	location ^~ /api/ {
		set $gateway http://gateway:8080;
		proxy_pass $gateway;
		include /etc/nginx/conf.d/proxy-api.inc;
	}

	# burst: ráfagas normales (abrir varias pestañas, el reintento del sistema de pago)
	location ^~ /api/visitas/ {
		limit_req zone=visitas burst=20 nodelay;
		set $gateway http://gateway:8080;
		proxy_pass $gateway;
		include /etc/nginx/conf.d/proxy-api.inc;
	}

	location = /api/pagos/aviso {
		limit_req zone=avisos burst=10 nodelay;
		set $gateway http://gateway:8080;
		proxy_pass $gateway;
		include /etc/nginx/conf.d/proxy-api.inc;
	}

	# Los archivos con hash en el nombre no cambian nunca: se guardan un año
	location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|webp|ico)$ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	# El enlace del correo trae el token en la URL: esta ruta no se registra
	location = /restablecer {
		access_log off;
		add_header Cache-Control "no-cache";
		try_files /index.html =404;
	}

	# Una ruta de Angular (/reportes, /eventos/5/datos) se resuelve en el navegador
	location / {
		add_header Cache-Control "no-cache";
		try_files $uri $uri/ /index.html;
	}
}
